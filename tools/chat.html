<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Chat</title>
<style>
  :root { --bg:#f6f6f3; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e2e2dc; --accent:#2f6f4f; --think:#f0efe8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141413; --fg:#ececE8; --muted:#9a9a93; --card:#1d1d1b; --line:#2e2e2b; --accent:#6fbf8f; --think:#232320; } }
  :root[data-theme="dark"] { --bg:#141413; --fg:#ececE8; --muted:#9a9a93; --card:#1d1d1b; --line:#2e2e2b; --accent:#6fbf8f; --think:#232320; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 -apple-system, system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted); }
  header b { color:var(--fg); font-size:15px; margin-right:auto; }
  header label { display:flex; gap:6px; align-items:center; }
  header input[type=number] { width:60px; }
  #log { flex:1; overflow-y:auto; padding:16px; max-width:860px; width:100%; margin:0 auto; }
  .msg { margin:0 0 14px; padding:10px 14px; border-radius:10px; background:var(--card); border:1px solid var(--line); white-space:pre-wrap; word-wrap:break-word; }
  .user { border-color:var(--accent); }
  details { background:var(--think); border-radius:8px; padding:6px 10px; margin-bottom:8px; color:var(--muted); font-size:13px; white-space:pre-wrap; }
  .stats { font-size:12px; color:var(--muted); margin-top:6px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); max-width:860px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; height:64px; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; }
  button { padding:0 18px; border-radius:8px; border:0; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.secondary { background:transparent; color:var(--muted); border:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <b>Forge · Inkling 2 Mini</b>
  <label>temp <input id="temp" type="number" step="0.1" value="1.0"></label>
  <label>max tokens <input id="max" type="number" value="1024"></label>
  <label><input id="showThink" type="checkbox" checked> show reasoning</label>
  <span id="status">server: …</span>
  <button class="secondary" id="clear" type="button">New chat</button>
</header>
<div id="log"></div>
<form id="f"><textarea id="q" placeholder="Message (Enter to send, Shift+Enter for newline)"></textarea><button>Send</button></form>
<script>
const API = "http://127.0.0.1:8080";
const log = document.getElementById("log"), q = document.getElementById("q"), status = document.getElementById("status");
let history = [];
async function ping() {
  try { const r = await fetch(API + "/v1/models"); status.textContent = r.ok ? "server: up" : "server: error"; }
  catch { status.textContent = "server: down"; }
}
ping(); setInterval(ping, 5000);
function el(cls, text) { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text || ""; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
document.getElementById("clear").onclick = () => { history = []; log.innerHTML = ""; };
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } });
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return; q.value = "";
  el("user", text); history.push({ role: "user", content: text });
  const box = el("bot"), think = document.createElement("details"), ans = document.createElement("div"), stats = document.createElement("div");
  think.innerHTML = "<summary>reasoning</summary>"; const thinkText = document.createElement("span"); think.appendChild(thinkText);
  stats.className = "stats"; if (document.getElementById("showThink").checked) box.appendChild(think); box.appendChild(ans); box.appendChild(stats);
  let content = "", t0 = performance.now(), tFirst = null, n = 0;
  try {
    const r = await fetch(API + "/v1/chat/completions", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "inkling-2-mini", messages: history, stream: true, max_tokens: +document.getElementById("max").value,
        temperature: +document.getElementById("temp").value, top_p: 1.0, top_k: 0, min_p: 0.0, timings_per_token: false }) });
    if (!r.ok) { ans.textContent = "Error " + r.status + ": " + await r.text(); return; }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "", timings = null;
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true }); const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue; const data = line.slice(5).trim(); if (data === "[DONE]") continue;
        const ev = JSON.parse(data); if (ev.timings) timings = ev.timings;
        const d = ev.choices?.[0]?.delta || {};
        if (d.reasoning_content) { tFirst ??= performance.now(); thinkText.textContent += d.reasoning_content; n++; }
        if (d.content) { tFirst ??= performance.now(); content += d.content; ans.textContent = content; n++; }
        log.scrollTop = log.scrollHeight;
      }
    }
    history.push({ role: "assistant", content });
    stats.textContent = timings
      ? `prompt ${timings.prompt_n} tok @ ${timings.prompt_per_second.toFixed(0)} tok/s · ${timings.predicted_n} tok @ ${timings.predicted_per_second.toFixed(1)} tok/s`
      : `first token ${((tFirst - t0) / 1000).toFixed(1)} s`;
  } catch (err) { ans.textContent = "Request failed: " + err; }
};
</script>
</body>
</html>
